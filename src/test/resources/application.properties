spring.application.name=shortliner
# Use H2 in tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
# Schema comes from the Flyway migrations, so tests also prove they match the entities.
spring.jpa.hibernate.ddl-auto=validate
# Don't let ambient OTEL_* variables configure exporters: BuildKit's docker-container driver injects
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=unix:///dev/otel-grpc.sock into RUN steps, which Boot would map
# to an invalid OTLP endpoint and fail every context in the Docker build.
management.opentelemetry.map-environment-variables=false
# Disable Kafka in tests
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

# Resource server: tests use spring-security-test's jwt() post-processor, so the JWKS is never fetched.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak.test/realms/shortliner/protocol/openid-connect/certs
keycloak.issuer-uri=http://keycloak.test/realms/shortliner
# Mirror production exposure so the actuator access rules are exercised.
management.endpoints.web.exposure.include=health,prometheus,metrics

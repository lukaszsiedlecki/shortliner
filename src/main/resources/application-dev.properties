spring.application.name=shortliner
server.port=${SERVER_PORT:8080}
spring.docker.compose.enabled=false
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate Properties
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway: databases created by the old ddl-auto=update have the V1 schema but no history table,
# so they're baselined at version 1 and only get V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Propagates the current trace context into Kafka record headers so
# downstream consumers (e.g. an analytics service) can continue the trace.
spring.kafka.template.observation-enabled=true
# OAuth2 resource server (Keycloak realm "shortliner"). JWKS is fetched lazily on the first
# authenticated request. issuer-uri is deliberately NOT set: it would fetch discovery from
# keycloak.local at startup, which doesn't resolve from pods. iss is validated in SecurityConfig.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak.local/realms/shortliner/protocol/openid-connect/certs}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak.local/realms/shortliner}

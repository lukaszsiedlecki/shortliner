# Verbose diagnostics for local development only. Activate on top of dev:
#   SPRING_PROFILES_ACTIVE=dev,local
# Kept out of dev because dev is the profile running in the cluster, where
# these flood Loki (security DEBUG fires on every probe; show-sql prints
# raw non-JSON lines to stdout).
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true

spring.docker.compose.enabled=false
spring.profiles.active=dev
# Kubernetes health probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health,prometheus,metrics

# Prometheus metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# OpenTelemetry. Boot maps the standard OTEL_* environment variables onto these properties and
# they take precedence, so export is configured the standard way: OTEL_EXPORTER_OTLP_ENDPOINT is the
# collector's *base* URL (Boot appends /v1/traces) and OTEL_TRACES_EXPORTER=otlp opts in. Trace
# export stays off until then, even with an endpoint set.
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
# Prometheus scrapes metrics and Loki collects stdout; without these the OTLP registry pulled in by
# the OpenTelemetry starter pushes metrics every minute (to localhost:4318 by default), and logs
# would follow traces to the collector.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# Structured JSON logs (trace/span IDs are included automatically via MDC).
# Unset by default for readable local console output; set to "logstash" or
# "ecs" in environments with a log aggregator (e.g. Loki, ELK).
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
